<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - Stackly Digital Marketing</title>
  <meta name="description" content="Create your Stackly account. Start your digital marketing journey today.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-shapes">
      <div class="auth-shape auth-shape-1"></div>
      <div class="auth-shape auth-shape-2"></div>
    </div>
    <div class="particles" data-particles="20"></div>
    
    <div class="auth-container" data-aos="zoom-in">
      <div class="auth-visual">
        <div class="auth-visual-shapes">
          <div class="auth-visual-shape" style="width: 200px; height: 200px; top: -50px; right: -50px;"></div>
          <div class="auth-visual-shape" style="width: 150px; height: 150px; bottom: 50px; left: -30px;"></div>
        </div>
        <h2>Join Stackly!</h2>
        <p>Create your account and unlock powerful digital marketing tools to grow your business.</p>
        <div style="margin-top: 40px; padding: 24px; background: rgba(255,255,255,0.1); border-radius: var(--radius-lg); border: 1px solid rgba(255,255,255,0.1);">
          <p style="font-size: 14px; opacity: 0.9; margin-bottom: 16px;">Already have an account?</p>
          <a href="login.html" class="btn btn-outline-white" style="width: 100%;">Sign In</a>
        </div>
      </div>
      
      <div class="auth-form-wrapper">
        <a href="../index.html" class="auth-logo">
          <img class="logo-img" src="../img/logo.png" alt="Stackly logo">
          Stackly
        </a>
        
        <h3>Create Account</h3>
        <p>Fill in your details to get started</p>
        
        <div class="message"></div>
        
        <form id="register-form">
          <div class="form-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe" required>
          </div>
          
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" required>
          </div>
          
          <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Min. 6 characters" required>
          </div>
          
          <div class="form-group">
            <label for="confirm-password">Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="Repeat password" required>
          </div>
          
          <div style="margin-bottom: 20px;">
            <label class="remember-me" style="font-size: 13px;">
              <input type="checkbox" required>
              I agree to the <a href="404.html" style="color: var(--primary); font-weight: 600;">Terms of Service</a> and <a href="404.html" style="color: var(--primary); font-weight: 600;">Privacy Policy</a>
            </label>
          </div>
          
          <button type="submit" class="btn btn-accent" style="width: 100%;">
            Create Account &#8594;
          </button>
        </form>
        
        <p style="text-align: center; margin-top: 24px; font-size: 14px; color: var(--gray-400);">
          Already have an account? <a href="login.html" style="color: var(--primary); font-weight: 600;">Sign In</a>
        </p>
      </div>
    </div>
  </div>
  
  <script src="../js/main.js"></script>
</body>
</html>
